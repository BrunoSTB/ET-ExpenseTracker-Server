name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ExpenseTracker.sln

      - name: Build
        run: dotnet build ExpenseTracker.sln --no-restore --configuration Release

      - name: Test
        run: >
          dotnet test ExpenseTracker.sln
          --no-build
          --configuration Release
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults
          --logger "console;verbosity=normal"

      - name: Install ReportGenerator
        if: ${{ !cancelled() }}
        run: dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.5.11

      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: |
          reportgenerator \
            -reports:"./TestResults/**/coverage.cobertura.xml" \
            -targetdir:./coverage-report \
            -reporttypes:"MarkdownSummaryGithub;Cobertura"
          cat ./coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce coverage threshold
        env:
          MIN_LINE_COVERAGE: 60
          ASSEMBLIES: ExpenseTracker.Domain ExpenseTracker.Application
        run: |
          filters=$(printf '+%s;' $ASSEMBLIES)
          reportgenerator \
            -reports:"./TestResults/**/coverage.cobertura.xml" \
            -targetdir:./coverage-threshold \
            -reporttypes:JsonSummary \
            "-assemblyfilters:${filters%;}"

          status=0
          for assembly in $ASSEMBLIES; do
            coverage=$(jq -r --arg name "$assembly" \
              '.coverage.assemblies[] | select(.name == $name) | .coverage // 0' \
              ./coverage-threshold/Summary.json)
            coverage=${coverage:-0}
            if awk -v c="$coverage" -v m="$MIN_LINE_COVERAGE" 'BEGIN { exit !(c < m) }'; then
              echo "::error::$assembly line coverage is ${coverage}% (minimum ${MIN_LINE_COVERAGE}%)"
              status=1
            else
              echo "$assembly line coverage: ${coverage}% (minimum ${MIN_LINE_COVERAGE}%)"
            fi
          done
          exit $status

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report/
          if-no-files-found: ignore
